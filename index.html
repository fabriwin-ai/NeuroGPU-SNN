<style>

<script>
const B=[
{s:'ω',r:'0.1–0.5 Hz',c:[1,.23,.36],f:.22,role:'cohesión espacial'},
{s:'δ',r:'0.5–4 Hz',c:[1,.62,.11],f:1.4,role:'acoplamiento de fase'},
{s:'θ',r:'4–8 Hz',c:[.96,.88,.3],f:5.7,role:'longitud y tasa de recableado'},
{s:'β',r:'13–30 Hz',c:[.24,.86,.59],f:19.7,role:'ganancia sináptica'},
{s:'γ',r:'30–80 Hz',c:[.24,.66,1],lo:30,hi:80,role:'aprendizaje hebbiano'},
{s:'ε',r:'80–128 Hz',c:[.72,.42,1],lo:80,hi:128,role:'repulsión / ruido'}];
const $=id=>document.getElementById(id),st=$('st'),rnd=Math.random;
const mEl=$('meters');
B.forEach((b,i)=>{const col=b.c.map(v=>Math.round(v*255)).join(',');mEl.insertAdjacentHTML('beforeend',`<div class="row" title="${b.role}"><span style="color:rgb(${col})">${b.s} <span class="mut">${b.r}</span></span><div class="bar"><i id="m${i}" style="background:rgb(${col})"></i></div><span class="mut" id="v${i}">0</span></div>`)});
// ---------- WebGL: fondo (fragment shader) + aristas (LINES) + neuronas (POINTS)
const cv=$('c'),gl=cv.getContext('webgl',{antialias:false,alpha:false,powerPreference:'high-performance'});
const BC=`vec3 bc(float b){if(b<.5)return vec3(1.,.23,.36);if(b<1.5)return vec3(1.,.62,.11);if(b<2.5)return vec3(.96,.88,.3);if(b<3.5)return vec3(.24,.86,.59);if(b<4.5)return vec3(.24,.66,1.);return vec3(.72,.42,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
function prog(v,f,at){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));at.forEach((n,i)=>gl.bindAttribLocation(p,i,n));gl.linkProgram(p);
 const u={};['uR','uT','uB','uCoh','uK','uGain','uB3','uPS','uP'].forEach(n=>u[n]=gl.getUniformLocation(p,n));u.p=p;return u}
const FH='precision highp float;';
const PB=prog('attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}',FH+`uniform vec2 uR;uniform float uT,uCoh;uniform float uB[6];
void main(){vec2 p=(gl_FragCoord.xy-.5*uR)/uR.y*2.;float r0=length(p);vec3 c=vec3(.012,.016,.03)*(1.4-r0*.5);
 float f=sin(p.x*2.+uT*.2)*sin(p.y*1.7-uT*.15)*uB[0]+sin(length(p-vec2(sin(uT*.3),cos(uT*.27)))*6.-uT*(.8+uB[1]*2.))*uB[2]*.5+sin(p.x*18.+p.y*14.+uT*3.)*uB[4]*.08+sin(r0*40.-uT*8.)*uB[5]*.05;
 c+=vec3(.05,.07,.12)*f*f*(.5+uCoh);gl_FragColor=vec4(c*1.6,1.);}`,['a']);
const PL=prog(BC+`attribute vec3 aP;attribute vec2 aS;uniform vec2 uR;varying vec3 vC;varying float vT,vS,vW;
void main(){float bi=floor(aP.z*.5);vW=aP.z-2.*bi;vC=bc(bi);vT=aS.x;vS=aS.y;gl_Position=vec4(aP.xy/vec2(uR.x/uR.y,1.),0.,1.);}`,
FH+`varying vec3 vC;varying float vT,vS,vW;uniform float uT,uK,uGain,uB3;
void main(){float pu=exp(-pow(fract(vT-uT*(.25+.6*uB3)+vS)-.5,2.)*60.);gl_FragColor=vec4(vC*vW*(.25+.9*pu)*uGain*uK,1.);}`,['aP','aS']);
const PP=prog(BC+`attribute vec4 aN;attribute vec2 aUV;uniform vec2 uR;uniform float uPS;varying vec3 vC;varying float vA;varying vec2 vUV;
void main(){vC=bc(aN.w);vA=aN.z;vUV=aUV;gl_Position=vec4(aN.xy/vec2(uR.x/uR.y,1.),0.,1.);gl_PointSize=uPS*(.5+aN.z);}`,
FH+`varying vec3 vC;varying float vA;varying vec2 vUV;uniform float uP,uMode;
void main(){vec2 q=gl_PointCoord*2.-1.;float d=dot(q,q);if(d>1.)discard;float g=exp(-d*3.5);
 vec2 uv=vUV*vec2(90.,150.)+q*vec2(1.5,1.5);vec2 grid=abs(fract(uv)-.5);
 float weave=1.-smoothstep(.035,.11,min(grid.x,grid.y));
 float fiber=.5+.5*sin(vUV.x*640.+sin(vUV.y*170.)*2.);
 float speck=fract(sin(dot(floor(vUV*vec2(230.,310.)),vec2(127.1,311.7)))*43758.5453);
 float seam=1.-smoothstep(.012,.035,abs(fract(vUV.y*28.)-.5));
 vec3 base=mix(vec3(.015,.12,.17),vC,.48);
 base*=.7+.2*fiber+.14*speck+.18*weave+.22*seam;
 float rim=smoothstep(.35,1.,d);
 vec3 textured=(base*(.28+g*.85)+vC*rim*.22+vec3(g*g*g*.65))*vA;
 vec3 glow=(vC*g*1.2+vec3(g*g*g))*vA;
 gl_FragColor=vec4(mix(glow,textured,step(.5,uMode))*uP,1.);}`,['aN','aUV']);
PP.uMode=gl.getUniformLocation(PP.p,'uMode');
const AV=prog('attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}',
FH+`uniform vec2 uR,uCenter;uniform float uT,uAct,uScale,uSize,uHolo,uLayout,uRotation,uMirror,uB[6];
float cap(vec2 p,vec2 a,vec2 b,float r){vec2 q=p-a,v=b-a;float h=clamp(dot(q,v)/dot(v,v),0.,1.);return length(q-v*h)-r;}
float ell(vec2 p,vec2 c,vec2 r){vec2 q=(p-c)/r;return (length(q)-1.)*min(r.x,r.y);}
float creature(vec2 p,float walk,float arm){
 float swing=(uAct>.5&&uAct<2.5?walk:0.)*.055;
 float d=ell(p,vec2(0.,.53),vec2(.225,.285));
 d=min(d,cap(p,vec2(0.,.31),vec2(0.,.4),.105));
 d=min(d,ell(p,vec2(0.,-.015),vec2(.245,.425)));
 d=min(d,cap(p,vec2(-.18,.27),vec2(-.31-swing,-.12),.075));
 d=min(d,cap(p,vec2(-.31-swing,-.12),vec2(-.35-swing,-.43),.055));
 d=min(d,cap(p,vec2(.18,.27),vec2(.31+swing,-.12),.075));
 d=min(d,cap(p,vec2(.31+swing,-.12),vec2(.35+arm+swing,-.43+arm),.055));
 d=min(d,ell(p,vec2(-.35-swing,-.45),vec2(.075,.085)));
 d=min(d,ell(p,vec2(.35+arm+swing,-.45+arm),vec2(.075,.085)));
 float lx=walk*.065;
 d=min(d,cap(p,vec2(-.105,-.34),vec2(-.15-lx,-.76),.082));
 d=min(d,cap(p,vec2(-.15-lx,-.76),vec2(-.19-lx,-.855),.066));
 d=min(d,cap(p,vec2(.105,-.34),vec2(.15+lx,-.76),.082));
 d=min(d,cap(p,vec2(.15+lx,-.76),vec2(.19+lx,-.855),.066));
 d=min(d,cap(p,vec2(-.19-lx,-.875),vec2(-.045-lx,-.875),.055));
 d=min(d,cap(p,vec2(.045+lx,-.875),vec2(.19+lx,-.875),.055));
 return d;
}
vec2 rotate2(vec2 p,float a){float c=cos(a),s=sin(a);return vec2(c*p.x-s*p.y,s*p.x+c*p.y);}
void main(){
 vec2 screen=(gl_FragCoord.xy-.5*uR)/uR.y*2.;
 float walk=(uAct>1.5&&uAct<2.5)?sin(uT*4.5):(uAct>.5&&uAct<1.5)?sin(uT*9.):sin(uT*2.);
 float arm=uAct>2.5&&uAct<3.5?.22:0.;
 float aa=1.5/uR.y,best=8.,shadow=0.;vec2 p=vec2(0.);
 if(uLayout>.5){
  float aspect=uR.x/uR.y,baseSideX=min(.68,aspect*.38),scale=min(.5,aspect*.64);
  float sideX=baseSideX;
  float size=min(uSize,aspect*.98/(sideX+.94*scale));
  sideX=min(baseSideX,.98-.94*scale*size);
  aa=1.5/(uR.y*scale*size);
  for(int i=0;i<4;i++){
   float angle=uRotation+(i==1?-1.5707963:i==2?3.1415926:i==3?1.5707963:0.);
   vec2 center=i==0?vec2(0.,.98-.94*scale*size):i==1?vec2(sideX,0.):i==2?vec2(0.,-.98+.94*scale*size):vec2(-sideX,0.);
   center=rotate2(center,uRotation);
   vec2 q=rotate2(screen-center,-angle);if(uMirror>.5)q.x=-q.x;q/=scale*size;
   float d=creature(q,walk,arm);
   if(d<best){best=d;p=q;}
   shadow=max(shadow,exp(-pow(q.x/.48,2.)-pow((q.y+.94)/.035,2.))*scale*size);
  }
 }else{
  p=(screen-vec2(uCenter.x,0.))/uSize;if(uMirror>.5)p.x=-p.x;p.x/=uScale;
  best=creature(p,walk,arm);shadow=exp(-pow(p.x/.48,2.)-pow((p.y+.94)/.035,2.));
 }
 float body=1.-smoothstep(-aa,aa,best);
 vec3 c=vec3(.012,.035,.048)+vec3(.025,.11,.14)*(.35+.65*uB[2]);
 float scales=sin(p.x*92.+sin(p.y*36.)*2.)*sin(p.y*116.);
 float weave=1.-smoothstep(.04,.18,abs(fract(p.x*55.+p.y*17.)-.5));
 float nerves=sin(p.x*34.+p.y*21.+uT*.16)*sin(p.y*48.-p.x*13.);
 c*=.84+.1*scales+.12*weave+.09*nerves;
 c+=vec3(.015,.16,.2)*smoothstep(.65,.9,scales)*(.3+uB[4]);
 float edge=1.-smoothstep(.0,.018,abs(best));
 c+=vec3(.08,.38,.48)*edge*(.25+.75*uB[3]);
 if(uHolo>.5)c=vec3(.025,.22,.3)+vec3(.04,.42,.52)*(.35+.65*uB[3])*(.45+.55*weave)+vec3(.16,.8,1.)*edge;
 float alpha=max(body*.96,shadow*.3);
 gl_FragColor=vec4(c*body+vec3(.015,.09,.13)*shadow,alpha);
}`,['a']);
AV.uR=gl.getUniformLocation(AV.p,'uR');AV.uCenter=gl.getUniformLocation(AV.p,'uCenter');
AV.uT=gl.getUniformLocation(AV.p,'uT');AV.uAct=gl.getUniformLocation(AV.p,'uAct');AV.uScale=gl.getUniformLocation(AV.p,'uScale');
AV.uSize=gl.getUniformLocation(AV.p,'uSize');AV.uHolo=gl.getUniformLocation(AV.p,'uHolo');AV.uLayout=gl.getUniformLocation(AV.p,'uLayout');AV.uRotation=gl.getUniformLocation(AV.p,'uRotation');AV.uMirror=gl.getUniformLocation(AV.p,'uMirror');AV.uB=gl.getUniformLocation(AV.p,'uB');
const PF=prog('attribute vec2 a;varying vec2 vUV;void main(){vUV=a*.5+.5;gl_Position=vec4(a,0.,1.);}',
 FH+`varying vec2 vUV;uniform sampler2D uTex;void main(){vec3 c=texture2D(uTex,vUV).rgb;float l=dot(c,vec3(.2126,.7152,.0722));float m=smoothstep(.42,.95,l);gl_FragColor=vec4(c*m,1.);}`,['a']);
const PBUR=prog('attribute vec2 a;varying vec2 vUV;void main(){vUV=a*.5+.5;gl_Position=vec4(a,0.,1.);}',
 FH+`varying vec2 vUV;uniform sampler2D uTex;uniform vec2 uStep;
void main(){vec3 c=texture2D(uTex,vUV).rgb*.227027;
 c+=(texture2D(uTex,vUV+uStep*1.384615).rgb+texture2D(uTex,vUV-uStep*1.384615).rgb)*.316216;
 c+=(texture2D(uTex,vUV+uStep*3.230769).rgb+texture2D(uTex,vUV-uStep*3.230769).rgb)*.070270;
 gl_FragColor=vec4(c,1.);}`,['a']);
const PC=prog('attribute vec2 a;varying vec2 vUV;void main(){vUV=a*.5+.5;gl_Position=vec4(a,0.,1.);}',
 FH+`varying vec2 vUV;uniform sampler2D uScene,uBloom;uniform vec2 uInv;
float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
void main(){vec3 nw=texture2D(uScene,vUV+uInv*vec2(-1.,-1.)).rgb,ne=texture2D(uScene,vUV+uInv*vec2(1.,-1.)).rgb;
 vec3 sw=texture2D(uScene,vUV+uInv*vec2(-1.,1.)).rgb,se=texture2D(uScene,vUV+uInv*vec2(1.,1.)).rgb,m=texture2D(uScene,vUV).rgb;
 float lnw=lum(nw),lne=lum(ne),lsw=lum(sw),lse=lum(se),lm=lum(m);
 vec2 d=vec2(-((lnw+lne)-(lsw+lse)),(lnw+lsw)-(lne+lse));
 float reduce=max((lnw+lne+lsw+lse)*(.25*.125),1./128.);float inv=1./(min(abs(d.x),abs(d.y))+reduce);
 d=clamp(d*inv,vec2(-8.),vec2(8.))*uInv;
 vec3 a=.5*(texture2D(uScene,vUV+d*(1./3.-.5)).rgb+texture2D(uScene,vUV+d*(2./3.-.5)).rgb);
 vec3 b=a*.5+.25*(texture2D(uScene,vUV+d*-.5).rgb+texture2D(uScene,vUV+d*.5).rgb);

const findK=(M,t)=>{for(const w of t)for(const k in M)if(M[k].includes(w))return k;return null};
function num(t,txt){const m=txt.match(/(\d+(?:\.\d+)?)\s*(%|khz|k\b)?/);if(m)return{n:+m[1],u:m[2]==='%'?'%':m[2]?'khz':''};
 let tot=0,cur=0,got=false;for(const w of t){const v=NW[w];if(v===undefined){if(got)break;continue}got=true;if(v===1000){tot+=(cur||1)*1000;cur=0}else cur+=v}
 return got?{n:tot+cur,u:''}:null}
const norm=s=>s.replace(/(\d),(\d)/g,'$1.$2').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!]|(?<!\d)\.|\.(?!\d)/g,' ')
 .replace(/por ciento/g,'%').replace(/\b(por favor|porfa|quiero que|quisiera|podrias|puedes|puede|me gustaria|please|could you|can you|would you)\b/g,' ')
 .replace(/\b(veinte|treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa)\s+y\s+(uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve)\b/g,'$1 $2') .replace(/\b(?!p[1-9]\b)([a-z]+)(\d)/g,'$1 $2').replace(/\s+/g,' ').trim();
function plan(c){
 const t=c.split(' ').map(fix);let verb=findK(VERB,t),obj=findK(OBJ,t),q=findK(QUAL,t),nm=num(t,c),ch=null,query=null;
 const io=findK(IO,t);if(io&&!obj)return{trace:`verb = ${io}; object = topology`,io};
 const pm=t.find(w=>/^p[1-9]$/.test(w));if(pm){obj='profile';nm={n:PROF[+pm[1]-1],u:''}}
 for(const [o,v,ws] of CH)if(ws.some(w=>t.includes(w))){ch={o,v};break}
 if(!obj&&(verb==='ask'||!verb)){query=findK(QONLY,t);if(query&&!verb)verb='ask'}
 if(!obj&&!query&&ch)obj=ch.o;
 if(!obj&&!query&&nm&&nm.u==='khz')obj='sr';
 if(verb==='ask'&&obj)query=obj;
 if(!verb&&obj&&(nm||ch||q))verb='set';
 if(q==='dbl'&&verb==='set')verb='up';
 if(query)ch=null;
 const trace=`verb = ${verb||'?'}; object = ${query||obj||'?'}${q?'; qual = '+q:''}${nm?'; num = '+nm.n+nm.u:''}${ch?'; choice = '+ch.v:''}`;
 if(query)return{trace,query};
 if(verb==='reset'){const ks=obj?[obj]:Object.keys(DEF);if(ks.some(k=>DEF[k]===undefined))throw'ese control no tiene valor por defecto';return{trace,acts:ks.map(k=>[k,String(DEF[k])])}}
 if(!verb||!obj)throw HINT;
 const S=verb==='down'?-1:1;
 if(SLd[obj]){const el=$(SLd[obj]),mx=+el.max,cur=+el.value;let v;
  if(verb==='on')v=DEF[obj];else if(verb==='off'||q==='min')v=0;else if(q==='max')v=mx;
  else if(verb==='set'){if(nm)v=nm.u==='%'?nm.n/100*mx:nm.n;else if(q==='half')v=mx/2;else throw'falta el valor (número, %, máximo, mínimo…)'}
  else{const d=nm?(nm.u==='%'?nm.n/100*mx:nm.n):q==='small'?.15*mx:q==='big'?.4*mx:.2*mx;v=q==='dbl'?cur*2:q==='half'?cur/2:cur+S*d}
  return{trace,acts:[[obj,Math.max(0,Math.min(mx,v)).toFixed(2)]]}}
 if(obj==='lod'){const sv=$('selLOD').value,cur=sv==='auto'?lod:+sv;let v;
  if(q==='auto'||verb==='on')v='auto';else if(ch&&ch.o==='lod')v=ch.v;else if(verb==='off'||q==='min')v='0';else if(q==='max')v='3';
  else if(verb==='set'&&nm)v=String(nm.n);else if(verb==='up'||verb==='down')v=String(Math.max(0,Math.min(3,cur+S*(nm?nm.n:1))));
  else throw'di el nivel: 0–3, bypass, predicción, gradiente, iterativo o auto';
  return{trace,acts:[['lod',v]]}}
 if(obj==='layers'){let v;if(q==='auto'||verb==='on')v='auto';else if(ch&&ch.o==='layers')v=ch.v;else throw'di: bloques, intercalado, por banda o auto';return{trace,acts:[['layers',v]]}}
 if(obj==='matrix'){let v;if(ch&&ch.o==='matrix')v=ch.v;else if(verb==='off')v='id';else throw'di: identidad, cooperativa, lateral o cascada';return{trace,acts:[['matrix',v]]}}
 if(obj==='profile'){const i=Math.max(0,PROF.indexOf(N));let n;
  if(q==='max')n=50000;else if(q==='min')n=32;else if(nm&&nm.u!=='%')n=nm.n;else if(verb==='up')n=PROF[Math.min(PROF.length-1,i+1)];else if(verb==='down')n=PROF[Math.max(0,i-1)];
  else throw'di cuántas neuronas (32…50000) o sube/baja un perfil';return{trace,acts:[['profile',String(n)]]}}
 if(obj==='sr'){const L=[44100,48000,96000],i=L.indexOf(near(L,+$('selSR').value||(ctx&&ctx.sampleRate)||48000));let v;
  if(q==='auto'||verb==='off')v='0';else if(nm)v=String(nm.n<1000?nm.n*1000:nm.n);else if(verb==='up')v=String(L[Math.min(2,i+1)]);else if(verb==='down')v=String(L[Math.max(0,i-1)]);
  else throw'di 44.1, 48 o 96 kHz';return{trace,acts:[['sr',v]]}}
 throw HINT;
}
function answer(k){
 const a=()=>{let n=0;for(let i=0;i<E;i++)if(EW[i]>.15)n++;return n};
 if(k==='mse')return`query { mse = ${mse.toExponential(1)}; nan = ${nanHits}; lod = ${lod}; }`;
 if(k==='syn'||k==='profile')return`query { neurons = ${N}; synapses = ${E}; active = ${a()}; }`;
 if(k==='dom'){let d=0;for(let i=1;i<6;i++)if(band[i]>band[d])d=i;return`query { dominant = ${B[d].s}; bands = [${Array.from(band,v=>v.toFixed(2)).join(', ')}]; }`}
 if(k==='lat'){if(!ctx)return'query { latency = n/a; // aún no hay contexto de audio }';const ol=((ctx.baseLatency||0)+(ctx.outputLatency||0))*1000;return`query { latency_ms = ${(ol+512/sr*1000+ft*1000).toFixed(0)}; sample_rate = ${sr}; }`}
 if(k==='state')return summary();
 if(k==='layers')return`query { interleave = ${LN[effMode].toLowerCase()}; select = ${$('selL').value}; flux = ${flux.toFixed(2)}; }`;
 if(k==='lod')return`query { lod = ${lod}; select = ${$('selLOD').value}; }`;
 if(k==='sr')return`query { sample_rate = ${ctx?ctx.sampleRate:'n/a'}; select = ${$('selSR').value}; }`;
 if(k==='matrix')return`query { matrix = ${$('mxPre').value}; }`;
 if(SLd[k])return`query { ${k} = ${(+$(SLd[k]).value).toFixed(2)}; }`;
 return'query { // sin datos }'}
function nl(line){
 const cl=norm(line).split(/\s*(?:,|;|\by\b|\bluego\b|\bdespues\b|\btambien\b|\bademas\b|\band\b|\bthen\b)\s*/).filter(Boolean),out=[];
 for(const c of cl){try{const p=plan(c);out.push(`parse { ${p.trace} }`);
  if(p.io){tdo(p.io);continue}
  if(p.query){out.push(answer(p.query));continue}
  const ok=[];for(const [k,v] of p.acts){CMD[k](v);ok.push(`${k} = ${v};`)}out.push(`ok { ${ok.join(' ')} }`)}
  catch(e){out.push(`error { "${c}": ${e} }`)}}
 say(out.join('\n'))}
document.querySelectorAll('.chip').forEach(b=>{b.onclick=()=>run(b.dataset.q)});
$('cin').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){run(e.target.value);e.target.value=''}});
if(innerWidth<720)$('chat').open=false;
let cpuS=0,cpuD=0;let last=performance.now(),T=0,hf=0;
function frame(ts){
 const dt=Math.min(.05,(ts-last)/1000);last=ts;T+=dt;
 const t0=performance.now();sense(dt,T);step(dt);const t1=performance.now();draw(T);nnGuard(dt);chatTick(dt);const t2=performance.now();cpuS+=((t1-t0)-cpuS)*.1;cpuD+=((t2-t1)-cpuD)*.1;
 ft+=(dt-ft)*.05;
 if(N>=2500&&ft>.045){if((slow+=dt)>3){const n=PROF[PROF.indexOf(N)-1];$('selP').value=n;build(n);st.textContent='Rendimiento bajo: perfil reducido a '+n+' neuronas';slow=0;ft=.016}}else slow=0;
 if((hf+=dt)>.1){hf=0;for(let i=0;i<6;i++){$('m'+i).style.width=(band[i]*100|0)+'%';$('v'+i).textContent=band[i].toFixed(2)}
  let a=0;for(let k=0;k<E;k++)if(EW[k]>.15)a++;
  if(cur>=0){let dm=0;for(let i=1;i<6;i++)if(band[i]>band[dm])dm=i;setS(Q[cur],'inferencia · dom '+B[dm].s+' · capas '+LN[effMode])}
  if(ctx){const ol=((ctx.baseLatency||0)+(ctx.outputLatency||0))*1000,wn=FFT/2/sr*1000+6.5;$('lat').textContent=`latencia est. ≈ ${(ol+wn+ft*1000).toFixed(0)} ms (salida ${ol.toFixed(0)} + análisis ${wn.toFixed(0)} + frame ${(ft*1000).toFixed(0)}) · ${(sr/1000).toFixed(1)} kHz`}
  $('nnst').textContent=nnInfo();
  $('stats').textContent=`${N} neuronas · sinapsis activas ${a}/${E} · R ${Rco.toFixed(2)} · capas ${LN[effMode]}${$('selL').value==='auto'?' (auto)':''} · flujo ${flux.toFixed(2)} · ${Math.round(1/ft)} fps${+$('selV').value>=2?' · avatar '+AVA_LABEL[avaAction]:''}`}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
